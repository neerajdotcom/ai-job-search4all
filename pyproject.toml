[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-search4all"
version = "2.0.0"
description = "Open, observable AI job search agent with resume tailoring and fit recommendations"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Neeraj Banerjee" }
]
dependencies = [
    "google-genai>=1.0.0",
    "groq>=0.11.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9",
    "mcp[cli]>=1.2,<2.0",
    "PyYAML>=6.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
]
crawlers = [
    "crawl4ai>=0.4.0",
]
observability = [
    "opik>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
